name: Release Audit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate tracked JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("benchmark/schemas").glob("*.json"):
              json.loads(p.read_text())
              print(f"OK: {p}")
          PY
      - name: Validate reproducibility guide
        run: test -f REPRODUCIBILITY.md
      - name: Validate release policy
        run: test -f docs/release_policy.md
      - name: Validate changelog
        run: test -f CHANGELOG.md
      - name: Public release audit
        run: python scripts/audit_public_release.py
      - name: Lint
        run: ruff check framework/ tests/ scripts/
      - name: Test
        run: pytest tests/ -q
      - name: Gold corpus evaluation
        run: python scripts/evaluate_gold_corpus.py
