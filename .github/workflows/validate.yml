name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("benchmark/schemas").glob("*.json"):
              json.loads(p.read_text())
              print(f"OK: {p}")
          PY
      - name: Lint
        run: ruff check framework/ tests/
      - name: Test
        run: pytest tests/ -q
