[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-fsm-benchmark"
version = "0.1.0"
description = "Behavioral, robustness, and reproducibility evaluation of LLM-generated FSMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "César Andrés" }]
keywords = [
  "finite-state-machines",
  "llm",
  "model-based-testing",
  "empirical-software-engineering",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["framework", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_core_batch1.py" = ["E501", "I001", "E402"]
"scripts/evaluate_gold_corpus.py" = ["E402", "I001"]
"scripts/aggregate_campaign_results.py" = ["E402", "I001"]
"scripts/generate_campaign_reports.py" = ["E402", "I001"]
"scripts/audit_public_release.py" = ["E402"]
"scripts/run_ollama_campaign.py" = ["E402"]
"scripts/ollama_campaign_lib.py" = ["E501"]
"tests/test_run_ollama_campaign.py" = ["E501"]
